name: Build Android test APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out BatchBoss
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Missing repository secret GOOGLE_SERVICES_JSON_BASE64"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Verify Firebase project and Play Store app identity
        run: |
          node - <<'NODE'
          const config = require('./app/google-services.json');
          const project = config.project_info?.project_id;
          const correctPackage = config.client?.some(c =>
            c.client_info?.android_client_info?.package_name === 'com.aistudio.batchboss.kqwxrv');
          if (project !== 'batch-boss-android' || !correctPackage) {
            throw new Error('Firebase project/package does not match the BatchBoss web and Android application.');
          }
          console.log('Verified shared BatchBoss Firebase project and Android package.');
          NODE

      - name: Create disposable CI debug signing key
        run: >-
          keytool -genkeypair -noprompt -keystore debug.keystore
          -storepass android -keypass android -alias androiddebugkey
          -keyalg RSA -keysize 2048 -validity 30
          -dname "CN=Android Debug,O=Android,C=US"

      - name: Run Android unit and invoice synchronization regression tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug bundleRelease --stacktrace

      - name: Verify release optimization metadata
        run: |
          test -s app/build/outputs/mapping/release/mapping.txt
          unzip -p app/build/outputs/bundle/release/app-release.aab BUNDLE-METADATA/com.android.tools/r8.json

      - name: Upload optimized validation bundle and mapping
        uses: actions/upload-artifact@v4
        with:
          name: BatchBoss-optimized-release-validation-debug-signed
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/
          if-no-files-found: error
          retention-days: 14

      - name: Upload BatchBoss APK
        uses: actions/upload-artifact@v4
        with:
          name: BatchBoss-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
