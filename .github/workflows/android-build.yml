name: Build Android test APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out BatchBoss
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Restoring Firebase configuration from GOOGLE_SERVICES_JSON_BASE64 secret..."
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          elif [ -f "app/google-services.json" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 secret not set; using committed app/google-services.json from repository."
          else
            echo "::error::Missing Firebase configuration. The repository secret GOOGLE_SERVICES_JSON_BASE64 is not configured and app/google-services.json is missing."
            exit 1
          fi

      - name: Create disposable CI debug signing key
        run: >-
          keytool -genkeypair -noprompt -keystore debug.keystore
          -storepass android -keypass android -alias androiddebugkey
          -keyalg RSA -keysize 2048 -validity 30
          -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK and release bundle
        run: gradle assembleDebug bundleRelease --stacktrace

      - name: Verify release optimization metadata
        run: |
          set -euo pipefail
          mapping="app/build/outputs/mapping/release/mapping.txt"
          bundle="app/build/outputs/bundle/release/app-release.aab"
          if [ ! -s "$bundle" ]; then
            echo "::error::Release Android App Bundle missing or empty: $bundle"
            exit 1
          fi
          if ! unzip -tq "$bundle" >/dev/null; then
            echo "::error::Release bundle ZIP integrity check failed: $bundle"
            exit 1
          fi
          if grep -q "isMinifyEnabled = true" app/build.gradle.kts; then
            if [ ! -s "$mapping" ]; then
              echo "::error::R8 is enabled (isMinifyEnabled = true) but mapping file is missing or empty: $mapping. Check release R8 task output."
              exit 1
            fi
            echo "Release bundle and R8 mapping file verified."
            ls -lh "$mapping" "$bundle"
          else
            echo "Release bundle verified (R8 minification is disabled; mapping file not required)."
            ls -lh "$bundle"
          fi

      - name: Upload optimized validation bundle and mapping
        uses: actions/upload-artifact@v4
        with:
          name: BatchBoss-optimized-release-validation-debug-signed
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload BatchBoss APK
        uses: actions/upload-artifact@v4
        with:
          name: BatchBoss-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
