name: Restore existing admin portal with correct Firebase web config
on:
  push:
    branches: [fix/restore-admin-firebase-config-20261023]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    env:
      VITE_FIREBASE_API_KEY: "AIzaSyBp_aulVgP52CVzgEWteFhTkmtfFKD5v6M"
      VITE_FIREBASE_AUTH_DOMAIN: "batch-boss-android.firebaseapp.com"
      VITE_FIREBASE_PROJECT_ID: "batch-boss-android"
      VITE_FIREBASE_STORAGE_BUCKET: "batch-boss-android.firebasestorage.app"
      VITE_FIREBASE_MESSAGING_SENDER_ID: "802048202389"
      VITE_FIREBASE_APP_ID: "1:802048202389:web:e0eceeb49caf0824b7ad9c"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Verify Firebase web configuration
        run: |
          test "$VITE_FIREBASE_PROJECT_ID" = "batch-boss-android"
          test -n "$VITE_FIREBASE_API_KEY"
          test -n "$VITE_FIREBASE_APP_ID"
      - name: Build original existing admin website
        run: npm run build
      - name: Verify compiled assets
        run: |
          test -s dist/index.html
          grep -rl 'batch-boss-android' dist/assets
          if grep -rl 'VITE_FIREBASE_API_KEY' dist/assets; then echo 'Unresolved Firebase environment variable'; exit 1; fi
      - name: Prepare xneelo upload
        run: |
          cd dist
          zip -qr ../../BatchBoss-admin-RESTORE-original-configured-xneelo.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: BatchBoss-admin-RESTORE-original-configured-xneelo
          path: BatchBoss-admin-RESTORE-original-configured-xneelo.zip
          retention-days: 14
