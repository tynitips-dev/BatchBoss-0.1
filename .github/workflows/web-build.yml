name: Build BatchBoss web portals

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "admin-web/**"
      - "functions/**"
      - "tests/**"
      - "firebase.json"
      - ".github/workflows/web-build.yml"

jobs:
  validate-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install function dependencies
        working-directory: functions
        run: npm install
      - name: Compile Firebase functions
        working-directory: functions
        run: npm run build
      - name: Test payment verification and regional checkout
        run: node --test tests/payment-core.cjs tests/paystack-flow.cjs tests/paddle-core.cjs tests/paddle-flow.cjs tests/legacy-billing.cjs

  build-customer-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Firebase web configuration
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          test -n "$VITE_FIREBASE_API_KEY" || { echo "Missing VITE_FIREBASE_API_KEY"; exit 1; }
          test -n "$VITE_FIREBASE_AUTH_DOMAIN" || { echo "Missing VITE_FIREBASE_AUTH_DOMAIN"; exit 1; }
          test -n "$VITE_FIREBASE_PROJECT_ID" || { echo "Missing VITE_FIREBASE_PROJECT_ID"; exit 1; }
          test -n "$VITE_FIREBASE_STORAGE_BUCKET" || { echo "Missing VITE_FIREBASE_STORAGE_BUCKET"; exit 1; }
          test -n "$VITE_FIREBASE_MESSAGING_SENDER_ID" || { echo "Missing VITE_FIREBASE_MESSAGING_SENDER_ID"; exit 1; }
          test -n "$VITE_FIREBASE_APP_ID" || { echo "Missing VITE_FIREBASE_APP_ID"; exit 1; }
          case "$VITE_FIREBASE_API_KEY" in AIza*) ;; *) echo "VITE_FIREBASE_API_KEY is not a valid Firebase Web API key"; exit 1;; esac
          test "$VITE_FIREBASE_PROJECT_ID" = "batch-boss-android" || { echo "Firebase project must be batch-boss-android"; exit 1; }
      - name: Install customer portal dependencies
        working-directory: web
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No committed web package-lock.json; installing dependencies from package.json"
            npm install --no-audit --no-fund
          fi
      - name: Test recipe costing and regional measurements
        run: node --test tests/workspace-utils.cjs tests/recipe-measurements.cjs tests/international-foundation.cjs tests/invoice-pdf.cjs
      - name: Build customer portal
        working-directory: web
        run: npm run build
        env:
          VITE_PADDLE_SANDBOX_ENABLED: ${{ vars.VITE_PADDLE_SANDBOX_ENABLED }}
          VITE_PADDLE_CLIENT_TOKEN: ${{ vars.VITE_PADDLE_CLIENT_TOKEN }}
          VITE_PADDLE_PRO_WEEK: ${{ vars.VITE_PADDLE_PRO_WEEK }}
          VITE_PADDLE_PRO_MONTH: ${{ vars.VITE_PADDLE_PRO_MONTH }}
          VITE_PADDLE_PRO_YEAR: ${{ vars.VITE_PADDLE_PRO_YEAR }}
          VITE_PADDLE_LAUNCH_MONTH: ${{ vars.VITE_PADDLE_LAUNCH_MONTH }}
          VITE_PADDLE_LAUNCH_YEAR: ${{ vars.VITE_PADDLE_LAUNCH_YEAR }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: BatchBoss-customer-portal
          path: web/dist
          if-no-files-found: error
          retention-days: 14

  build-admin-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Firebase web configuration
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          test -n "$VITE_FIREBASE_API_KEY" || { echo "Missing VITE_FIREBASE_API_KEY"; exit 1; }
          test -n "$VITE_FIREBASE_AUTH_DOMAIN" || { echo "Missing VITE_FIREBASE_AUTH_DOMAIN"; exit 1; }
          test -n "$VITE_FIREBASE_PROJECT_ID" || { echo "Missing VITE_FIREBASE_PROJECT_ID"; exit 1; }
          test -n "$VITE_FIREBASE_STORAGE_BUCKET" || { echo "Missing VITE_FIREBASE_STORAGE_BUCKET"; exit 1; }
          test -n "$VITE_FIREBASE_MESSAGING_SENDER_ID" || { echo "Missing VITE_FIREBASE_MESSAGING_SENDER_ID"; exit 1; }
          test -n "$VITE_FIREBASE_APP_ID" || { echo "Missing VITE_FIREBASE_APP_ID"; exit 1; }
          case "$VITE_FIREBASE_API_KEY" in AIza*) ;; *) echo "VITE_FIREBASE_API_KEY is not a valid Firebase Web API key"; exit 1;; esac
          test "$VITE_FIREBASE_PROJECT_ID" = "batch-boss-android" || { echo "Firebase project must be batch-boss-android"; exit 1; }
      - name: Install administrator portal dependencies
        working-directory: admin-web
        run: npm install
      - name: Build administrator portal
        working-directory: admin-web
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: BatchBoss-admin-portal
          path: admin-web/dist
          if-no-files-found: error
          retention-days: 14
