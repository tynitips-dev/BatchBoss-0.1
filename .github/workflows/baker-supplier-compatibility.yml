name: Baker supplier compatibility
on:
  pull_request:
    paths:
      - 'app/**'
      - 'web/**'
      - 'tests/supplier-records.test.mjs'
      - '.github/workflows/baker-supplier-compatibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
        working-directory: web
      - run: node --experimental-strip-types --test tests/supplier-records.test.mjs
      - run: npm run build
        working-directory: web
  android-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compile Android and run isolated supplier tests
        run: gradle :app:compileDebugKotlin :app:testDebugUnitTest --tests 'com.example.SupplierCompatibilityTest' -x :app:processDebugGoogleServices --stacktrace
      - name: Preserve supplier test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baker-supplier-compatibility-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
