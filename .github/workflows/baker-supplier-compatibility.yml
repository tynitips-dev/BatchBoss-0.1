name: Baker supplier compatibility
on:
  pull_request:
    paths:
      - 'app/**'
      - 'web/**'
      - 'admin-web/**'
      - 'functions/**'
      - 'tests/pro-codes-emulator*'
      - 'tests/pro-codes-emulator/**'
      - 'tests/supplier-records.test.mjs'
      - 'tests/subscription-access.test.mjs'
      - 'tests/auth-flow.cjs'
      - 'tests/account-platform-emulator.cjs'
      - 'tests/supplier-emulator/**'
      - '.github/workflows/baker-supplier-compatibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-contract:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: 'AIzaSyBp_aulVgP52CVzgEWteFhTkmtfFKD5v6M'
      VITE_FIREBASE_AUTH_DOMAIN: 'batch-boss-android.firebaseapp.com'
      VITE_FIREBASE_PROJECT_ID: 'batch-boss-android'
      VITE_FIREBASE_STORAGE_BUCKET: 'batch-boss-android.firebasestorage.app'
      VITE_FIREBASE_MESSAGING_SENDER_ID: '802048202389'
      VITE_FIREBASE_APP_ID: '1:802048202389:web:e0eceeb49caf0824b7ad9c'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: web
      - run: node --experimental-strip-types --test tests/supplier-records.test.mjs tests/subscription-access.test.mjs tests/recipe-photo.mjs tests/recipe-expenses.mjs tests/recipe-pricing.mjs
      - run: npm run build
        working-directory: web
  android-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Android and run isolated supplier tests
        run: gradle :app:compileDebugKotlin :app:testDebugUnitTest --tests 'com.example.SupplierCompatibilityTest' --tests 'com.example.SubscriptionAlignmentTest' --tests 'com.example.Version22MigrationTest' --tests 'com.example.RecipePhotoCompatibilityTest' -x :app:processDebugGoogleServices --stacktrace
      - name: Verify actual Android supplier transactions against local Firestore
        run: >-
          npx --yes firebase-tools@14.22.0 emulators:exec
          --project demo-batchboss-supplier-sync
          --config tests/supplier-emulator/firebase.json
          --only firestore
          "gradle :app:testDebugUnitTest --tests com.example.SupplierFirestoreEmulatorTest -x :app:processDebugGoogleServices --no-daemon --stacktrace"
      - name: Preserve supplier test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baker-supplier-compatibility-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

  pro-code-redemption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
        working-directory: functions
      - run: npm run build
        working-directory: functions
      - run: node --test tests/auth-flow.cjs
      - name: Stage the exact application rules inside the isolated test project
        run: cp web/firestore.rules tests/pro-codes-emulator/firestore.rules
      - name: Test actual redemption transactions and private rules in isolated Firestore
        run: >-
          npx --yes firebase-tools@14.22.0 emulators:exec
          --project demo-batchboss-pro-codes
          --config tests/pro-codes-emulator/firebase.json
          --only firestore,auth
          "node --test tests/pro-codes-emulator.cjs tests/account-platform-emulator.cjs"
      - run: npm install --no-audit --no-fund
        working-directory: admin-web
      - run: npx tsc -b
        working-directory: admin-web
