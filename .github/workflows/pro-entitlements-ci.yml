name: Pro entitlement safety checks
on:
  push:
    branches:
      - safety/pro-migration-gate-20261021
  pull_request:
    paths:
      - 'functions/**'
      - '.github/workflows/pro-entitlements-ci.yml'
permissions:
  contents: read
jobs:
  functions-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without running package scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Compile TypeScript and run Pro entitlement tests
        run: npm run test:entitlements
      - name: Lint TypeScript
        run: npm run lint
      - name: Install Java for isolated Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Firestore emulator integration checks (demo project only)
        working-directory: .
        env:
          GCLOUD_PROJECT: demo-batchboss
          PRO_ENTITLEMENT_MIGRATION_ENABLED: 'false'
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-batchboss "node --test functions/tests/pro-entitlement-emulator.test.mjs"
