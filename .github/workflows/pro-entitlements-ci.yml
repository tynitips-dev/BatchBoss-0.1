name: Pro entitlement safety checks
on:
  push:
    branches:
      - safety/pro-migration-gate-20261021
  pull_request:
    paths:
      - 'functions/**'
      - '.github/workflows/pro-entitlements-ci.yml'
permissions:
  contents: read
jobs:
  functions-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without running package scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Compile TypeScript and run Pro entitlement tests
        run: npm run test:entitlements
      - name: Lint TypeScript
        run: npm run lint
