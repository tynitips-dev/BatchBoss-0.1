name: Sales partner baker integration checks
on:
  workflow_dispatch:
    inputs:
      include_private_supplier:
        description: 'Run pinned private supplier PR 9 (requires SUPPLIER_REPO_READ_TOKEN)'
        type: boolean
        default: false
  push:
    branches: ['integration/sales-partners-all-20261106']
  pull_request:
    paths:
      - 'functions/**'
      - 'partners/**'
      - 'web/**'
      - 'tests/partner-referral-emulator.cjs'
      - 'tests/auth-flow.cjs'
      - 'tests/referral-emulators/**'
      - '.github/workflows/partner-referral-integration.yml'
permissions:
  contents: read
jobs:
  supplier-cross-project:
    if: github.event_name == 'workflow_dispatch' && inputs.include_private_supplier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require scoped private repository access
        env:
          SUPPLIER_TOKEN: ${{ secrets.SUPPLIER_REPO_READ_TOKEN }}
        run: test -n "$SUPPLIER_TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: tynitips-dev/BatchBoss-suppliers
          ref: 7f1e3ef4a6e431f6536256eb9ee3b04e32ca8d52
          token: ${{ secrets.SUPPLIER_REPO_READ_TOKEN }}
          path: .supplier-fixture
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: functions
      - run: npm run build
        working-directory: functions
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: partners/functions
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: .supplier-fixture/functions
      - run: node --test partners/functions/*.test.js .supplier-fixture/functions/*.test.js
        env:
          SUPPLIER_SOURCE: ${{ github.workspace }}/.supplier-fixture/functions
      - name: All three isolated stores and actual source handlers
        env:
          BATCHBOSS_PARTNER_SOURCE: ${{ github.workspace }}
          BATCHBOSS_SUPPLIER_SOURCE: ${{ github.workspace }}/.supplier-fixture
        run: >-
          npx --yes firebase-tools@15.34.1 emulators:exec
          --only auth,firestore --project demo-referral-tests
          --config tests/referral-emulators/firebase.json
          "node tests/partner-referral-emulator.cjs"
  compile-and-regress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: functions
      - run: npm run build
        working-directory: functions
      - run: node --test tests/paystack-flow.cjs tests/auth-flow.cjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_FIREBASE_API_KEY: emulator-fake-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-batchboss-baker.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-batchboss-baker
          VITE_FIREBASE_STORAGE_BUCKET: demo-batchboss-baker.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '123'
          VITE_FIREBASE_APP_ID: '1:123:web:test'
          VITE_PARTNER_REFERRAL_EMULATOR: 'true'
  baker-partner-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: functions
      - run: npm run build
        working-directory: functions
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: partners/functions
      - name: Exercise actual handlers with local Auth, Firestore and mocked Paystack
        env:
          BATCHBOSS_PARTNER_SOURCE: ${{ github.workspace }}
        run: >-
          npx --yes firebase-tools@15.34.1 emulators:exec
          --only auth,firestore --project demo-referral-tests
          --config tests/referral-emulators/firebase.json
          "node tests/partner-referral-emulator.cjs"
