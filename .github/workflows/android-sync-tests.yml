name: Android sync regression tests
on:
  push:
    branches:
      - safety/pro-migration-gate-20261021
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/android-sync-tests.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/android-sync-tests.yml'
permissions:
  contents: read
jobs:
  android-sync-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Run isolated Robolectric customer and recipe sync tests
        run: gradle --no-daemon --no-configuration-cache --console=plain :app:testDebugUnitTest --tests "com.example.BakerySyncRobolectricTest"
